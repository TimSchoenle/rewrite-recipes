name: "Setup Java and Gradle Environment"
description: "Setup Java and Gradle environment for building"

inputs:
  java_version:
    description: "Java version to install"
    required: false
    default: "21"

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: TimSchoenle/actions/actions/java-gradle/setup-base-environment@0406974974a3aaf884e7c65866b091d266614b46 # tag=actions-java-gradle-setup-base-environment-v1.2.11
      with:
        java_version: ${{ inputs.java_version }}
