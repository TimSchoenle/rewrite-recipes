name: "Setup Java and Gradle Environment"
description: "Setup Java and Gradle environment for building"

inputs:
  java_version:
    description: "Java version to install"
    required: false
    default: "21"

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: TimSchoenle/actions/actions/java-gradle/setup-base-environment@dd88df40bf3d468464176cc5a7630fcfd04908a1 # tag=actions-java-gradle-setup-base-environment-v1.2.7
      with:
        java_version: ${{ inputs.java_version }}
