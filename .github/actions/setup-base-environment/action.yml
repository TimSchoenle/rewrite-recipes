name: "Setup Java and Gradle Environment"
description: "Setup Java and Gradle environment for building"

inputs:
  java_version:
    description: "Java version to install"
    required: false
    default: "21"

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: TimSchoenle/actions/actions/java-gradle/setup-base-environment@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-java-gradle-setup-base-environment-v1.2.10
      with:
        java_version: ${{ inputs.java_version }}
