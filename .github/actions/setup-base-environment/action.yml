name: "Setup Java and Gradle Environment"
description: "Setup Java and Gradle environment for building"

inputs:
  java_version:
    description: "Java version to install"
    required: false
    default: "21"

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: TimSchoenle/actions/actions/java-gradle/setup-base-environment@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-java-gradle-setup-base-environment-v1.2.15
      with:
        java_version: ${{ inputs.java_version }}
