name: CI

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build and Test (Java ${{ matrix.java_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java_version: [ '21', '25' ]
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Base Environment
        uses: $/.github/actions/setup-base-environment
        with:
          java_version: ${{ matrix.java_version }}

      - name: Verify Recipes and Catalog
        # `test` does not run `javadoc`, so the javadoc half of the doclint gate in
        # buildSrc/src/main/kotlin/rewrite.java-conventions.gradle.kts only runs if it is named.
        run: ./gradlew --no-daemon clean test javadoc :catalog:jar

  # Kept apart from `build-and-test`, so a Codecov outage fails this job alone. The upload
  # authenticates with this job's OIDC token, so the job needs no environment and no secret.
  # `.github/codecov.yml` decides what the Codecov statuses check. Measured once, on the newer of
  # the two Java versions `build-and-test` runs.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/java-gradle/coverage-codecov@e4229b81c3c3c880b9561dc4d53bd87ccf49eaf3 # tag=actions-java-gradle-coverage-codecov-v1.1.4
        with:
          java_version: '25'
          flags: java
