name: CI

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build and Test (Java ${{ matrix.java_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java_version: [ '21', '25' ]
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Base Environment
        uses: ./.github/actions/setup-base-environment
        with:
          java_version: ${{ matrix.java_version }}

      - name: Verify Recipes and Catalog
        # `test` does not run `javadoc`, so the javadoc half of the doclint gate in
        # buildSrc/src/main/kotlin/rewrite.java-conventions.gradle.kts only runs if it is named.
        run: ./gradlew --no-daemon clean test javadoc :catalog:jar
