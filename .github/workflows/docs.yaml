name: Docs

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Renders README.md from its template and commits the result back to the pull request. A render
  # that changes nothing produces no commit, so an unrelated pull request is not touched.
  render:
    name: Render
    # A fork's branch cannot be committed to, and the App token is not issued to a fork's pull
    # request. Those go through `readme` below, which only reads.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code; the commit is made through the App token below
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          # Narrowed to the one permission the render commit needs. An unscoped token inherits every
          # permission the installation holds, which zizmor's `github-app` rule reports as an error.
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Generate the licence payload
        id: config
        run: |
          set -euo pipefail
          license="$(sed -n 's/^license=//p' gradle.properties | head -n 1)"
          json="$(jq -nc --arg license "$license" '{ repo: { license: $license } }')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-common-readme-variables-v1.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Render and commit the README
        uses: TimSchoenle/actions/actions/common/render-template-and-commit@0406974974a3aaf884e7c65866b091d266614b46 # tag=actions-common-render-template-and-commit-v1.1.5
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          token: ${{ steps.generate_token.outputs.token }}
          commit_message: 'docs: render README from its template'

  # The drift gate. A README.md that does not match its template fails here instead of merging.
  readme:
    name: README
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate the licence payload
        id: config
        run: |
          set -euo pipefail
          license="$(sed -n 's/^license=//p' gradle.properties | head -n 1)"
          json="$(jq -nc --arg license "$license" '{ repo: { license: $license } }')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-common-readme-variables-v1.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@c7e430537b061a61687ed9308048fc319c97a59c # tag=actions-common-render-template-v1.1.3
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: 'true'
