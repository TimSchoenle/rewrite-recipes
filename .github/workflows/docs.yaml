name: Docs

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The drift gate for pushes and forks, where nothing commits. A README.md that does not match its
  # template fails here instead of merging. Pull requests from this repository are rendered and
  # committed by generate.yaml and generate-commit.yaml.
  readme:
    name: README
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate the licence payload
        id: config
        run: |
          set -euo pipefail
          license="$(sed -n 's/^license=//p' gradle.properties | head -n 1)"
          json="$(jq -nc --arg license "$license" '{ repo: { license: $license } }')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-readme@be7a69175612d9de514acc14bf55dda8e7ad2e57 # tag=actions-common-render-readme-v1.1.0
        with:
          extra: ${{ steps.config.outputs.json }}
          check: 'true'
