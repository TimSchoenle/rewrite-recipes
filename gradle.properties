# Facts the README render payload reads. The build does not depend on them: every published module
# assigns its own group, version and coordinates in its own build script, and those assignments run
# after these properties are applied. This file exists because .github/workflows/docs.yaml has to
# read the catalog's version from data rather than from Kotlin.
#
# `version` tracks the catalog, because the catalog is the coordinate a consumer writes down.
# release-please keeps it in step through the `/gradle.properties` entry under the `catalog` package
# in release-please-config.json.

group=de.timscho.rewrite
artifactId=catalog
license=Apache-2.0
description=OpenRewrite recipes for Java static analysis and InvUI 1.x to 2.x migration, published as one catalog.

# x-release-please-start-version
version=0.2.0
# x-release-please-end

# The class file level every module compiles to, set in buildSrc/src/main/kotlin/rewrite.java-conventions.gradle.kts.
javaVersion=21
